name: build

# On a v* tag (or by hand): run the offline tests on macOS and Windows, build the single-file
# app on each, and attach both zips to the tag's GitHub release. The product page links to
# releases/latest/download/<these fixed names>, so keep the names unchanged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple silicon
            zip: SharePoint-Navigator-macOS-AppleSilicon.zip
          - os: windows-latest
            zip: SharePoint-Navigator-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest tests/test_service.py
      - name: Build (includes the app's self-check)
        run: python build_app.py
      # ditto keeps the .app's internal links and ad hoc signature, which plain zip can break.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/SharePoint Navigator.app" "${{ matrix.zip }}"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\SharePoint Navigator.exe" -DestinationPath "${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  release:
    # Only tags make a release; a manual run just leaves the zips as workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Download the zip for your system, unzip it, and double-click the app. First launch: see https://yusungchang.github.io/sharepoint-navigator/#download. Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/HISTORY.md"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "SharePoint Navigator ${TAG#v}" --notes "$notes"
          gh release upload "$TAG" out/*.zip -R "$GITHUB_REPOSITORY" --clobber
