name: build

# On a v* tag (or by hand): run the offline tests on macOS and Windows, build the app on each,
# and attach what build_app.py puts in dist/release/ to the tag's GitHub release: the Mac .dmg,
# the Windows installer and a portable Windows zip. The product page links to
# releases/latest/download/<these fixed names>, so keep the names unchanged.
# The Mac app is signed with the Developer ID and notarized when the APPLE_* secrets exist
# (docs/SIGNING.md); a v* tag without them fails, so a release is never unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple silicon
            name: macos-apple-silicon
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest tests/test_service.py
      # The certificate goes into a throwaway keychain that only this job uses. build_app.py
      # signs and notarizes when the APPLE_* variables are set, and signs ad hoc otherwise.
      - name: Mac signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            KC="$RUNNER_TEMP/signing.keychain-db"
            KC_PASSWORD=$(openssl rand -hex 16)
            security create-keychain -p "$KC_PASSWORD" "$KC"
            # No auto-lock during the build (6 h), then unlock it for codesign.
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KC_PASSWORD" "$KC"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
            rm -f "$RUNNER_TEMP/cert.p12"
            # Lets codesign use the key without a prompt (there is no one to click Allow).
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
            # Put it first in the search list, keeping the runner's own keychains after it.
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            # codesign needs Apple's Developer ID intermediate to build the chain; without it the
            # identity counts as invalid.
            curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true
            security find-identity -v -p codesigning "$KC" | grep -F "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null \
              || { echo "::error::The certificate does not hold the identity in APPLE_SIGNING_IDENTITY."; exit 1; }
            # Values stay masked in the log; each is a single line, as GITHUB_ENV needs.
            for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
            echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with the Developer ID and notarizing."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::A release tag needs the APPLE_* secrets (run tools/signing/setup-mac.sh)."
            exit 1
          else
            echo "No signing secrets: ad hoc signed build."
          fi
      # The Windows installer is compiled with Inno Setup 6; install it if the runner lacks it.
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not installed." }
      - name: Build (self-check; signing, notarizing and the dmg on macOS; the installer on Windows)
        run: python build_app.py
      # Check what people actually get. The dmg: signed, notarized and stapled, and Gatekeeper accepts
      # opening it. The app inside it: Developer ID, stapled ticket, "Notarized Developer ID".
      - name: Check the Mac dmg and app
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls dist/release/*.dmg)
          if [ "${MAC_SIGNED:-}" = 1 ]; then
            codesign --verify --verbose=2 "$DMG"
            xcrun stapler validate "$DMG"
            if spctl --status | grep -q enabled; then
              spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG" 2>&1 \
                | tee /dev/stderr | grep "source=Notarized Developer ID"
            fi
          fi
          M=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$M" "$DMG"
          APP="$M/SharePoint Navigator.app"
          test -L "$M/Applications"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "${MAC_SIGNED:-}" = 1 ]; then
            codesign -dv --verbose=2 "$APP" 2>&1 | grep "^Authority=Developer ID Application: "
            xcrun stapler validate "$APP"
            if spctl --status | grep -q enabled; then
              spctl --assess --type execute --verbose=2 "$APP" 2>&1 | tee /dev/stderr \
                | grep "source=Notarized Developer ID"
            fi
          fi
          hdiutil detach "$M"
      # Install silently as a user would, run the installed copy's self-check, then uninstall and
      # make sure it is gone (the Start menu entry too).
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\release\*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SharePoint Navigator'
          $exe = Join-Path $dir 'SharePoint Navigator.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\SharePoint Navigator.lnk'
          if (-not (Test-Path $link)) { throw "No Start menu entry at $link" }
          $check = Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "The installed app's self-check failed." }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Uninstall left $exe behind." }
          if (Test-Path $link) { throw "Uninstall left the Start menu entry behind." }
          Get-ChildItem dist\release
      - uses: actions/upload-artifact@v4
        with:
          name: sharepoint-navigator-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    # Only tags make a release; a manual run just leaves the files as workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="macOS: open the .dmg and drag SharePoint Navigator to Applications (signed and notarized by Apple). Windows: run SharePoint-Navigator-Windows-Setup.exe, or use the zip to run it without installing. First launch: see https://yusungchang.com/sharepoint-navigator/#download. Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/HISTORY.md"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "SharePoint Navigator ${TAG#v}" --notes "$notes"
          ls -l out
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
